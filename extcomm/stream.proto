syntax = "proto3";

package opcomms.extcomm;

import "extcomm/common.proto";

enum Axis {
    AXIS_UNKNOWN = 0;
    AXIS_PAN = 1;
    AXIS_TILT = 2;
}

enum MotorDirection {
    MOTOR_DIR_UNKNOWN = 0;
    MOTOR_DIR_CW = 1;
    MOTOR_DIR_CCW = 2;
}

message AxisInfo {
    // Which axis this info refers to (default AXIS_UNKNOWN)
    Axis axis = 1;

    // Position (in degrees)
    float angle_deg = 2;

    // Motor direction for this axis
    MotorDirection motor_direction = 3;
}

// High-frequency stream packets (server -> client) such as position updates.
message StreamPacket {
    Header header = 1;

    oneof payload {
        AxisInfo axis_info = 10;
    }
}
