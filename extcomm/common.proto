syntax = "proto3";

package opcomms.extcomm;

// Common types shared by extcomm protos

enum SchemaVersion {
    SCHEMA_VERSION_UNSPECIFIED = 0;
    SCHEMA_VERSION = 1;
}

message Header {
    // Protocol/schema version
    uint32 version = 1;

    // Sequence number for ordering/acks
    uint32 seq = 2;

    // Counts how many times seq has wrapped (monotonic upper bits for redundancy)
    uint32 seq_epoch = 3;
}
